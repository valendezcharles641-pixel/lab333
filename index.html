<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitTrack Pro - Login</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg p-4">
          <div class="card-body text-center">
            <div class="mb-3 text-primary">
              <i class="bi bi-activity display-4"></i>
            </div>
            <h3 class="fw-bold mb-1">FitTrack Pro</h3>
            <p class="text-muted small mb-4">Sign in to manage your workouts</p>

            <!-- Alert Container for Messages -->
            <div id="alertContainer"></div>

            <!-- Login Form -->
            <form id="loginForm">
              <div class="mb-3 text-start">
                <label for="username" class="form-label fw-semibold">Username / Email</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control" id="username" placeholder="e.g. alex_fitness" required>
                </div>
              </div>

              <div class="mb-3 text-start">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                Sign In <i class="bi bi-arrow-right-short"></i>
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript Modules -->
  <script src="js/login.js"></script>
</body>
</html>
